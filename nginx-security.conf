# Заголовки безопасности для nginx.
# Подключить внутрь блока server { ... } через:  include /etc/nginx/nginx-security.conf;
# Проверить и применить:  sudo nginx -t && sudo systemctl reload nginx

add_header X-Content-Type-Options        "nosniff"                        always;
add_header X-Frame-Options               "DENY"                           always;
add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# HSTS включать только после того, как заработал HTTPS (certbot)
add_header Strict-Transport-Security     "max-age=31536000; includeSubDomains" always;

add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'" always;

# не отдавать версию nginx
server_tokens off;
